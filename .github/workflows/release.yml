name: Release Windows Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install root dependencies
        run: npm ci

      # Decode the signing certificate only when the secret is present.
      # electron-builder signs when CSC_LINK is set and skips signing otherwise,
      # so absent secrets simply produce an unsigned installer.
      - name: Prepare code-signing certificate
        id: signing
        shell: pwsh
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
        run: |
          if ([string]::IsNullOrEmpty($env:WINDOWS_CERT_BASE64)) {
            Write-Host "No signing certificate secret found - building unsigned."
            "signed=false" >> $env:GITHUB_OUTPUT
          } else {
            $pfxPath = Join-Path $env:RUNNER_TEMP "windows-cert.pfx"
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CERT_BASE64))
            "csc_link=$pfxPath" >> $env:GITHUB_OUTPUT
            "signed=true" >> $env:GITHUB_OUTPUT
            Write-Host "Signing certificate decoded to $pfxPath"
          }

      - name: Build NSIS installer
        shell: pwsh
        env:
          CSC_LINK: ${{ steps.signing.outputs.csc_link }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run build-app
          npx electron-builder --win --x64 --publish never

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: TimeTrack-windows-installer
          path: dist-electron/*.exe
          if-no-files-found: error

      - name: Attach installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-electron/*.exe
